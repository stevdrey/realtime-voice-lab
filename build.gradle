plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

def javafxModules = ['javafx.controls', 'javafx.fxml']

javafx {
    version = '27.0.1'
    modules = javafxModules
}

application {
    mainModule = 'io.github.stevdrey.realtimevoicelab'
    mainClass = 'io.github.stevdrey.realtimevoicelab.ui.RealtimeVoiceLabApp'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Keep headless rendering independent of the developer's desktop and graphics driver.
    systemProperty 'glass.platform', 'Headless'
    systemProperty 'prism.order', 'sw'
    ['DISPLAY', 'WAYLAND_DISPLAY'].each { environment.remove(it) }
    // Desktop tests use synthetic sessions and bundled rates.
    ['OPENAI_API_KEY', 'RVL_PRICING_FILE', 'RVL_ESTIMATED_SPEND_LIMIT_USD'].each { environment.remove(it) }

    // JavaFX loads natives from named modules even when JUnit tests run on the classpath.
    def javafxTestModules = sourceSets.test.runtimeClasspath.filter { it.name.startsWith('javafx-') }
    classpath = sourceSets.test.runtimeClasspath.minus(javafxTestModules)
    inputs.files(javafxTestModules).withNormalizer(ClasspathNormalizer)
    jvmArgumentProviders.add({
        ['--module-path', javafxTestModules.asPath, '--add-modules', javafxModules.join(','),
         '--enable-native-access=javafx.graphics']
    } as CommandLineArgumentProvider)
}
